[workspace]
resolver = "3"
members = ["apps/api", "apps/migrator", "apps/realtime", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
aws-config = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }

kivo-onboarding = { path = "crates/onboarding" }
kivo-tenancy = { path = "crates/tenancy" }
kivo-planning = { path = "crates/planning" }
kivo-files = { path = "crates/files" }
kivo-postgres = { path = "crates/postgres" }
kivo-rate-limit = { path = "crates/rate-limit" }
kivo-object-storage-s3 = { path = "crates/object-storage-s3" }

kivo-identity = { path = "crates/identity" }
kivo-auth0 = { path = "crates/auth0" }
kivo-realtime = { path = "crates/realtime" }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2 = "0.10"
